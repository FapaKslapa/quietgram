services:
  ig-engine:
    build: .
    image: ig-engine:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8000"
    env_file:
      - ./.env
    environment:
      DATA_DIR: /data
      INTERACTIONS_ENABLED: "${INTERACTIONS_ENABLED:-false}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
