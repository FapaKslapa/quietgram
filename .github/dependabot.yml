version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: development
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /apps/ig-engine
    target-branch: development
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /apps/ig-engine
    target-branch: development
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
